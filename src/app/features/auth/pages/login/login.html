<main class="login">
  <!-- Fondo: foto de nómina (public/fondo-login.jpg) con una capa azul oscuro encima -->
  <div class="login__foto" aria-hidden="true"></div>
  <div class="login__capa" aria-hidden="true"></div>

  <form class="login__card" (submit)="entrar($event)" novalidate>
    <header class="login__head">
      <!-- Logo de RPS Contabilidad (mismo recibo del menú lateral, en versión clara) -->
      <span class="login__logo">
        <svg class="login__logo-icono" viewBox="0 0 40 46" aria-hidden="true">
          <path d="M5 0h30a5 5 0 0 1 5 5v41l-5-4-5 4-5-4-5 4-5-4-5 4-5-4-5 4V5a5 5 0 0 1 5-5z" fill="#ffffff" />
          <rect x="9" y="9" width="22" height="4" rx="2" fill="#0c2a52" />
          <rect x="9" y="18" width="16" height="4" rx="2" fill="#0c2a52" />
          <rect x="9" y="28" width="22" height="4.5" rx="2.25" fill="#3d8be0" />
        </svg>
        <span class="login__logo-txt">
          <strong>RPS</strong>
          <small>Contabilidad</small>
        </span>
      </span>
      <h1>Iniciar sesión</h1>
      <p>Preparación de honorarios para Contabilidad.</p>
    </header>

    @if (expirada) {
      <div class="aviso aviso--info" role="status">
        <app-icon name="info" [size]="18" /> <span>Tu sesión terminó. Vuelve a ingresar para continuar.</span>
      </div>
    }
    @if (error(); as e) {
      <div class="aviso aviso--danger" role="alert">
        <app-icon name="alert" [size]="18" /> <span>{{ e }}</span>
      </div>
    }

    <div class="login__campo">
      <label for="email">Correo</label>
      <input id="email" class="login__input" type="email" autocomplete="username" [value]="email()"
             (input)="email.set($any($event.target).value)" [attr.aria-invalid]="!!errores()['email']"
             [attr.aria-describedby]="errores()['email'] ? 'email-error' : null" />
      @if (errores()['email']) { <span id="email-error" class="login__error">{{ errores()['email'] }}</span> }
    </div>

    <div class="login__campo">
      <label for="password">Contraseña</label>
      <span class="clave">
        <input id="password" class="login__input" [type]="verPassword() ? 'text' : 'password'" autocomplete="current-password"
               [value]="password()" (input)="password.set($any($event.target).value)"
               [attr.aria-invalid]="!!errores()['password']"
               [attr.aria-describedby]="errores()['password'] ? 'password-error' : null" />
        <button type="button" class="clave__ver" (click)="verPassword.set(!verPassword())"
                [attr.aria-pressed]="verPassword()">{{ verPassword() ? 'Ocultar' : 'Mostrar' }}</button>
      </span>
      @if (errores()['password']) { <span id="password-error" class="login__error">{{ errores()['password'] }}</span> }
    </div>

    <button type="submit" class="login__btn" [disabled]="enviando()">
      {{ enviando() ? 'Ingresando…' : 'Ingresar' }}
    </button>
  </form>
</main>
