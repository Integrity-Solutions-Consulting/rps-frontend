<div class="fondo" (click)="cancelar.emit()"></div>
<section class="ventana" role="dialog" aria-modal="true" aria-labelledby="cambiar-rol-titulo">
  <header class="ventana__head">
    <div>
      <h2 id="cambiar-rol-titulo">Cambiar rol</h2>
      <p class="muted small">{{ usuario().nombre }} · {{ usuario().email }}</p>
    </div>
    <button type="button" class="btn btn--ghost btn--sm cerrar" aria-label="Cerrar" (click)="cancelar.emit()">
      <app-icon name="x" [size]="18" />
    </button>
  </header>

  <div class="ventana__cuerpo cuerpo">
    <div class="field">
      <span class="field__label" id="cr-rol">Rol</span>
      <div class="roles" role="radiogroup" aria-labelledby="cr-rol">
        @for (r of roles(); track r) {
          <button type="button" role="radio" class="rol" [class.is-on]="rol() === r" [attr.aria-checked]="rol() === r" (click)="elegido.set(r)">
            {{ r }}
          </button>
        }
      </div>
      <span class="field__hint">El cambio se aplica en su próxima renovación de sesión o cuando vuelva a entrar.</span>
    </div>
    @if (error(); as e) {
      <div class="aviso aviso--danger"><app-icon name="alert" [size]="18" /><div>{{ e }}</div></div>
    }
  </div>

  <footer class="ventana__pie">
    <button type="button" class="btn" (click)="cancelar.emit()" [disabled]="guardando()">Cancelar</button>
    <button type="button" class="btn btn--azul" (click)="guardar()" [disabled]="!hayCambio() || guardando()">
      <app-icon name="save" [size]="17" /> {{ guardando() ? 'Guardando…' : 'Guardar rol' }}
    </button>
  </footer>
</section>
