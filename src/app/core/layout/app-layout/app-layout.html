<div class="shell" [class.shell--menu]="menuAbierto()">
  <app-sidebar class="shell__sidebar" />
  <button class="shell__scrim" type="button" aria-label="Cerrar menú" (click)="menuAbierto.set(false)"></button>

  <div class="shell__main">
    <app-navbar (toggleMenu)="menuAbierto.set(!menuAbierto())" />
    <main class="shell__content">
      <router-outlet />
    </main>
    @if (usaMocks) {
      <footer class="shell__footer">{{ textoMocks }} · no vienen del backend</footer>
    }
  </div>
</div>

<div class="toasts" aria-live="polite">
  @for (aviso of notifications.avisos(); track aviso.id) {
    <div class="toast" [class]="'toast toast--' + aviso.tipo" role="status">
      <app-icon [name]="aviso.tipo === 'error' ? 'alert' : aviso.tipo === 'ok' ? 'check' : 'info'" [size]="18" />
      <span>{{ aviso.mensaje }}</span>
      @if (aviso.accion; as accion) {
        <button type="button" class="toast__accion" (click)="notifications.ejecutar(aviso)">{{ accion.texto }}</button>
        <span class="toast__tiempo" aria-hidden="true" [style.animation-duration.ms]="aviso.duracion"></span>
      }
      <button type="button" class="toast__close" aria-label="Cerrar" (click)="notifications.cerrar(aviso.id)">
        <app-icon name="x" [size]="16" />
      </button>
    </div>
  }
</div>
